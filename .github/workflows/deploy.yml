name: Deploy to Kubernetes

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production
      version:
        description: 'Image tag to deploy (default: latest)'
        required: false
        type: string
        default: 'latest'

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy to Kubernetes
        env:
          KUBE_NAMESPACE: ${{ github.event.inputs.environment || 'staging' }}
          IMAGE_TAG: ${{ github.event.inputs.version || 'latest' }}
        run: |
          # Set the Kubernetes context
          kubectl config set-context --current --namespace=$KUBE_NAMESPACE
          
          # Apply Kubernetes manifests
          kubectl apply -f k8s/$KUBE_NAMESPACE/
          
          # Update the image
          kubectl set image deployment/vybe-$KUBE_NAMESPACE vybe=ghcr.io/your-org/vybe:$IMAGE_TAG -n $KUBE_NAMESPACE
          
          # Wait for rollout to complete
          kubectl rollout status deployment/vybe-$KUBE_NAMESPACE -n $KUBE_NAMESPACE
          
          # Get service info
          echo "Deployment to $KUBE_NAMESPACE complete!"
          kubectl get services -n $KUBE_NAMESPACE

      - name: Verify deployment
        run: |
          # Add verification steps here
          echo "Verifying deployment..."
          # Example: curl -sSf http://vybe-${{ github.event.inputs.environment || 'staging' }}-service.${{ github.event.inputs.environment || 'staging' }}.svc.cluster.local/health

      - name: Send notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "Deployment to ${{ github.event.inputs.environment || 'staging' }} ${{ job.status }}"
          SLACK_MESSAGE: "Deployment of ${{ github.sha }} to ${{ github.event.inputs.environment || 'staging' }} ${{ job.status }}.\nView run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SLACK_COLOR: ${{ job.status == 'success' && 'good' || 'danger' }}
