name: Dependency Updates

on:
  schedule:
    # Run every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Update Python dependencies
        run: |
          # Create requirements.in if it doesn't exist
          if [ ! -f requirements.in ]; then
            echo "Creating requirements.in from requirements.txt"
            pip freeze > requirements.in
          fi
          
          # Update dependencies
          pip install pip-tools
          pip-compile --upgrade requirements.in
          
          # Check for security vulnerabilities
          pip install safety
          safety check

      - name: Update Node.js dependencies
        run: |
          cd frontend
          npm update
          npm audit fix --force
          
          # Check for security vulnerabilities
          npm audit --audit-level moderate

      - name: Run tests after updates
        run: |
          # Install updated dependencies
          pip install -r requirements.txt
          cd frontend && npm ci
          
          # Run Python tests
          pytest backend/ --maxfail=5
          
          # Run frontend tests
          cd frontend && npm test -- --watchAll=false

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update dependencies'
          title: 'Automated dependency updates - $(date +%Y-%m-%d)'
          body: |
            ## Automated Dependency Updates
            
            This PR contains automated dependency updates for $(date +%Y-%m-%d).
            
            ### Python Dependencies
            - Updated all Python packages to latest versions
            - Fixed security vulnerabilities
            
            ### Node.js Dependencies  
            - Updated all npm packages to latest versions
            - Fixed security vulnerabilities
            
            ### Testing
            - [x] All tests pass
            - [x] No breaking changes detected
            - [x] Security scan passes
            
            ### Review Checklist
            - [ ] Review dependency changes
            - [ ] Test functionality manually
            - [ ] Verify no breaking changes
            - [ ] Approve and merge
          branch: dependency-updates-$(date +%Y%m%d)
          delete-branch: true
          labels: |
            dependencies
            automated
            maintenance