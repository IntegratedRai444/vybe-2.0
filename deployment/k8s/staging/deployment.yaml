apiVersion: apps/v1
kind: Deployment
metadata:
  name: vybe-staging
  namespace: staging
  labels:
    app: vybe
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vybe
      environment: staging
  template:
    metadata:
      labels:
        app: vybe
        environment: staging
    spec:
      containers:
        - name: vybe
          image: ghcr.io/your-org/vybe:staging
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "staging"
            - name: LOG_LEVEL
              value: "INFO"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: vybe-secrets
                  key: database-url
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          configMap:
            name: vybe-config
---
apiVersion: v1
kind: Service
metadata:
  name: vybe-staging-service
  namespace: staging
spec:
  selector:
    app: vybe
    environment: staging
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vybe-config
  namespace: staging
data:
  environment: "staging"
  log_level: "INFO"
  max_workers: "4"
---
apiVersion: v1
kind: Secret
metadata:
  name: vybe-secrets
  namespace: staging
type: Opaque
data:
  database-url: <base64-encoded-database-url>
  api-key: <base64-encoded-api-key>
