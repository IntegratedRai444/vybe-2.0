apiVersion: apps/v1
kind: Deployment
metadata:
  name: vybe-production
  namespace: production
  labels:
    app: vybe
    environment: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vybe
      environment: production
  template:
    metadata:
      labels:
        app: vybe
        environment: production
    spec:
      containers:
      - name: vybe
        image: ghcr.io/your-org/vybe:latest
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: LOG_LEVEL
          value: "WARNING"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: vybe-secrets
              key: database-url
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: config
          mountPath: /app/config
        - name: logs
          mountPath: /app/logs
      volumes:
      - name: config
        configMap:
          name: vybe-config
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: vybe-production-service
  namespace: production
spec:
  selector:
    app: vybe
    environment: production
  ports:
  - port: 80
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vybe-config
  namespace: production
data:
  environment: "production"
  log_level: "WARNING"
  max_workers: "8"
---
apiVersion: v1
kind: Secret
metadata:
  name: vybe-secrets
  namespace: production
type: Opaque
data:
  database-url: <base64-encoded-database-url>
  api-key: <base64-encoded-api-key>
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vybe-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vybe-production
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
