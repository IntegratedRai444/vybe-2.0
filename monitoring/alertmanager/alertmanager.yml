global:
  # The default SMTP From header field
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '${ALERT_EMAIL_FROM}'
  smtp_auth_username: '${ALERT_EMAIL_USER}'
  smtp_auth_password: '${ALERT_EMAIL_PASSWORD}'
  smtp_require_tls: true

  # Slack API URL (incoming webhook)
  slack_api_url: '${SLACK_WEBHOOK_URL}'

# The root route on which each incoming alert enters
route:
  # Default receiver
  receiver: 'slack-notifications'
  # Group alerts by alertname for 30s
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  
  # Child routes for different alert severities
  routes:
    - receiver: 'critical-alerts'
      match:
        severity: 'critical'
      continue: true
      
    - receiver: 'warning-alerts'
      match:
        severity: 'warning'
      continue: true

# Receivers
receivers:
  - name: 'slack-notifications'
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ template "slack.vybe.title" . }}'
        text: '{{ template "slack.vybe.text" . }}'
        color: '{{ if eq .Status "firing" }}danger{{ else }}good{{ end }}'
        
  - name: 'critical-alerts'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true
        headers:
          subject: '[CRITICAL] {{ .CommonAnnotations.summary }}'
    slack_configs:
      - channel: '#critical-alerts'
        send_resolved: true
        title: '{{ template "slack.vybe.title" . }}'
        text: '{{ template "slack.vybe.text" . }}'
        color: 'danger'
        
  - name: 'warning-alerts'
    email_configs:
      - to: '${ALERT_EMAIL_TO}'
        send_resolved: true
        headers:
          subject: '[WARNING] {{ .CommonAnnotations.summary }}'
    slack_configs:
      - channel: '#alerts'
        send_resolved: true
        title: '{{ template "slack.vybe.title" . }}'
        text: '{{ template "slack.vybe.text" . }}'
        color: 'warning'

# Templates
templates:
  - 'templates/*.tmpl'
