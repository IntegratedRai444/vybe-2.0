global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - 'alert.rules.yml'
  - 'rules/*.rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
    # Alertmanager configuration
    scheme: http
    timeout: 10s

# Scrape configurations
scrape_configs:
  # Vybe application metrics
  - job_name: 'vybe-application'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: 
        - 'vybe-backend:8001'  # Metrics endpoint
    relabel_configs:
      - source_labels: [__address__]
        target_label: __metrics_path__
        replacement: /metrics

  # Vybe API metrics
  - job_name: 'vybe-api'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['vybe-backend:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'vybe-backend:8000'

  # Node exporter for system metrics
  - job_name: 'node-exporter'
    scrape_interval: 10s
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: '${1}:9100'

  # PostgreSQL metrics
  - job_name: 'postgres-exporter'
    scrape_interval: 20s
    static_configs:
      - targets: ['postgres-exporter:9187']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'postgres:5432'

  # Redis metrics
  - job_name: 'redis-exporter'
    scrape_interval: 15s
    static_configs:
      - targets: ['redis-exporter:9121']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'redis:6379'

  # Docker metrics
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'docker-host'

  # Blackbox exporter for HTTP/HTTPS checks
  - job_name: 'blackbox-http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - 'http://vybe-backend:8000/health'
        - 'http://vybe-frontend:80'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'
